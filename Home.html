<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Weather App</title>
        <link rel="stylesheet" href="style.css">
    </head>
<body>
    <div class="main">
        <div class="search">
            <input type="text" placeholder="Enter city name" 
            spellcheck="false">
            <button><img src="C:\Users\ADMIN\OneDrive\Desktop\weather app\images\search.png"></button>
        </div>
        <div class="error">
            <p> Invalid City Name</p>
        </div>
        <div class="weather">
            <img src="C:\Users\ADMIN\OneDrive\Desktop\weather app\images\rain.png" class="weather-icon">
            <h1 class="temperature">12°C</h1>
            <h2 class="city">Kolhapur</h2>
            <div class="details">
                <div class="column">
                    <img src="C:\Users\ADMIN\OneDrive\Desktop\weather app\images\humidity.png">
                        <div>
                            <p class="humidity">70%</p>
                            <p>Humidity</p>
                        </div>
                </div>
                <div class="column">
                    <img src="C:\Users\ADMIN\OneDrive\Desktop\weather app\images\wind.png">
                        <div>
                            <p class="wind">7 km/h</p>
                            <p>Wind Speed</p>
                        </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script>

    const apiKey = "38215a23968506ac6b2cb4389ef4f623";
    const apiUrl = "https://api.openweathermap.org/data/2.5/weather?units=metric&q="
    
const searchBox = document.querySelector(".search input");
const searchBtn = document.querySelector(".search button");
const weathericon = document.querySelector(".weather-icon");

    async function checkWeather(city){
        const response = await fetch(apiUrl + city + `&appid=${apiKey}`)

        if (response.status == 404){
            document.querySelector(".error").style.display = "block";
            document.querySelector(".weather").style.display = "none";
        }
        else{

        var data= await response.json()

        //console.log(data);

        document.querySelector(".city").innerHTML = data.name;
        document.querySelector(".temperature").innerHTML = Math.round(data.main.temp) + "°C";
        document.querySelector(".humidity").innerHTML = data.main.humidity + "%";
        document.querySelector(".wind").innerHTML = data.wind.speed + " km/h";

        if (data.weather[0].main =="Clouds"){
            weathericon.src="C:/Users/ADMIN/OneDrive/Desktop/weather app/images/clouds.png";
        }
        else if (data.weather[0].main =="Clear"){
            weathericon.src="C:/Users/ADMIN/OneDrive/Desktop/weather app/images/clear.png";
        }
        else if (data.weather[0].main =="Rain"){
            weathericon.src="C:/Users/ADMIN/OneDrive/Desktop/weather app/images/rain.png";
        }
        else if (data.weather[0].main =="Drizzle"){
            weathericon.src="C:/Users/ADMIN/OneDrive/Desktop/weather app/images/drizzle.png";
        }
        else if (data.weather[0].main =="Mist"){
            weathericon.src="C:/Users/ADMIN/OneDrive/Desktop/weather app/images/mist.png";
        }

        document.querySelector(".weather").style.display = "block";
        document.querySelector(".error").style.display = "none";
    }}

    searchBtn.addEventListener("click", ()=>{
        checkWeather(searchBox.value);
    })

</script>
</html>
